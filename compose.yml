# Один сервис camofox-browser на Hermes-профиль, запущен постоянно
# (restart: unless-stopped) — конвенция: инстанс всегда доступен на ноутбуке,
# время жизни самого браузера внутри регулируется переменными окружения
# camofox-browser (BROWSER_IDLE_TIMEOUT_MS и т.д.), не Docker'ом.
#
# Клиентские сервисы живут в compose.d/<profile-name>.yml — генерируются
# автоматически плагином mercurio-lobby при градуации нового клиента.
#
# Порты по конвенции: REST = 9377 + N, VNC = 5900 + N (N = 0, 1, 2...).

x-camofox-common: &camofox-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &camofox-common-env
    ENABLE_VNC: "1"
    VNC_RFB_BIND: "0.0.0.0"
    VNC_PORT: "5900"
    VNC_RESOLUTION: "1600x900"
    CAMOFOX_WINDOW_SIZE: "1600x900"
    MAX_OLD_SPACE_SIZE: "512"
    # Общий формальный пароль на все инстансы — софт жёстко требует его для
    # VNC_RFB_BIND не-loopback (vnc-watcher.sh отказывается стартовать без
    # него), на простоту внутри домашней LAN это не влияет.
    VNC_PASSWORD: "password"
    # Бюджет памяти ноутбука: 8GB на 4 профиля = 2GB на инстанс (mem_limit
    # ниже). Эти два лимита держат фактическое использование в рамках
    # измеренного живого потребления (прод-тест 14.10.2026: один Camoufox-
    # движок без вкладок ~650-700MB, каждая дополнительная тяжёлая вкладка
    # Ozon добавляет ~115-245MB отдельным процессом) — 2 вкладки на
    # пользователя не должны выходить за 2GB mem_limit даже на тяжёлых сайтах.
    MAX_CONCURRENT_PER_USER: "2"
    BROWSER_IDLE_TIMEOUT_MS: "3600000"
    # Отдельный от BROWSER_IDLE_TIMEOUT_MS таймер — закрывает КОНКРЕТНУЮ
    # вкладку, если по ней 5 минут (дефолт) не было вызовов REST API. Не
    # видит ручную активность человека через VNC — поднят до того же
    # часа, чтобы не закрывать вкладку из-под рук при ручной работе.
    TAB_INACTIVITY_MS: "3600000"

services:
  # Профиль Hermes: default (max)
  max:
    <<: *camofox-common
    ports:
      - "9377:9377"
      - "5900:5900"
    environment:
      <<: *camofox-common-env
      CAMOFOX_PORT: "9377"
    volumes:
      - "./data/default:/root/.camofox/profiles"
    mem_limit: "2g"
    mem_reservation: "512m"

include:
  - compose.d/client-5080161070.yml
  - compose.d/client-6470649135.yml
